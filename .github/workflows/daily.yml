name: Daily fetch

on:
  schedule:
    - cron: "0 3 * * *"   # 07:00 Muscat time, every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["sources.json", "community/**", "data/seed_*.csv", "radar/**", "demo/**", "docs/team/**", ".github/workflows/daily.yml"]

permissions:
  contents: write   # commit the refreshed files
  pages: write      # deploy the website
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Fetch events
        env:
          RADAR_WEBHOOK_URL: ${{ secrets.RADAR_WEBHOOK_URL }}
          RADAR_WEBHOOK_SECRET: ${{ secrets.RADAR_WEBHOOK_SECRET }}
        run: python -m radar
      - name: Commit updated calendar
        run: |
          git config user.name "events-radar-bot"
          git config user.email "events-radar-bot@users.noreply.github.com"
          git add docs/*.json docs/*.csv docs/*.ics data/state.json data/discovered.json data/news_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily update $(date -u +%F)"
          # someone may have pushed to main during the run: rebase onto it, so this run's state (and the change
          # sequence numbers already sent by webhook) is never lost
          for attempt in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 10; done
          exit 1

      # ---- website: the demo, pre-rendered with today's files, plus every API file at its usual URL ----
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Build website
        working-directory: demo
        env:
          RADAR_DATA_DIR: ${{ github.workspace }}/docs
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          scripts/assemble-pages.sh "$RADAR_DATA_DIR" "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
